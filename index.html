<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DISCORD ACTIVITY OUTLAW</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .status-badge {
            background-color: #1a233a;
            color: #7289da;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #5865f2;
            border-radius: 50%;
        }

        .brand-title {
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 1px;
        }

        .brand-title span {
            color: #5865f2;
        }

        .main-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            height: 600px;
        }

        .control-panel {
            background-color: #121824;
            border-radius: 12px;
            padding: 24px;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border: 1px solid #1e293b;
        }

        .panel-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 12px;
            color: #94a3b8;
        }

        .input-field, .select-field {
            width: 100%;
            padding: 12px;
            background-color: #0b0e14;
            border: 1px solid #1e293b;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .input-field:focus, .select-field:focus {
            border-color: #5865f2;
        }

        .btn-primary {
            background-color: #00a8ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .player-container {
            flex: 1;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid #1e293b;
        }

        .video-wrapper {
            flex: 1;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-footer {
            background-color: #121824;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #1e293b;
        }

        .player-info h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .player-info p {
            font-size: 12px;
            color: #94a3b8;
        }

        .btn-secondary {
            background-color: #1e293b;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-secondary:hover {
            background-color: #334155;
        }

        .placeholder-text {
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="status-badge">
            <span class="status-dot"></span>
            <span>Discord Activity Active</span>
        </div>
        <div class="brand-title">DISCORD ACTIVITY <span>OUTLAW</span></div>
    </div>

    <div class="main-container">
        <!-- لوحة التحكم -->
        <div class="control-panel">
            <div class="panel-title">التحكم والمشاهدة الجماعية</div>
            
            <div class="input-group">
                <label for="mediaId">رابط IMDb/TMDB أو الـ ID</label>
                <input type="text" id="mediaId" class="input-field" placeholder="مثال: tt0816692" value="tt0816692">
            </div>

            <div class="input-group">
                <label for="mediaType">نوع المحتوى</label>
                <select id="mediaType" class="select-field">
                    <option value="movie">🎥 فيلم (Movie)</option>
                    <option value="tv">📺 مسلسل (TV Show)</option>
                </select>
            </div>

            <button id="btnPlay" class="btn-primary">تشغيل وبدء البث</button>
        </div>

        <!-- المشغل -->
        <div class="player-container">
            <div class="video-wrapper" id="videoWrapper">
                <div class="placeholder-text" id="placeholderText">ضع المعرّف واضغط على "تشغيل وبدء البث"</div>
            </div>

            <div class="player-footer">
                <button id="btnNextServer" class="btn-secondary">السيرفر التالي</button>
                <div class="player-info">
                    <h3>جاهز للبدء والمشاهدة</h3>
                    <p>في انتظار إدخال المعرّف...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const servers = [
            "https://vidsrc.to/embed/",
            "https://vidsrc.me/embed/",
            "https://2embed.org/embed/"
        ];
        
        let currentServerIndex = 0;

        function cleanMediaId(input) {
            if (!input) return "";
            const imdbMatch = input.match(/tt\d+/);
            if (imdbMatch) return imdbMatch[0];
            return input.trim();
        }

        // جلب معلومات الفيلم من السيرفر الخاص بك (باستخدام TMDB API بأمان)
        async function fetchMovieInfo(mediaType, mediaId) {
            try {
                const res = await fetch(`/api/info/${mediaType}/${mediaId}`);
                const data = await res.json();
                if (data && (data.title || data.name)) {
                    document.querySelector('.player-info h3').textContent = data.title || data.name;
                    document.querySelector('.player-info p').textContent = (data.overview || "").substring(0, 90) + '...';
                }
            } catch (e) {
                console.error("تعذر جلب تفاصيل الفيلم", e);
            }
        }

        function loadPlayer() {
            const rawInput = document.getElementById('mediaId').value;
            const mediaType = document.getElementById('mediaType').value;
            const cleanId = cleanMediaId(rawInput);
            const wrapper = document.getElementById('videoWrapper');

            if (!cleanId) {
                alert('يرجى إدخال ID صحيح.');
                return;
            }

            // جلب تفاصيل الفيلم من السيرفر الخلفي
            fetchMovieInfo(mediaType, cleanId);

            const currentServer = servers[currentServerIndex];
            const finalUrl = `${currentServer}${mediaType}/${cleanId}`;

            wrapper.innerHTML = '';
            const iframe = document.createElement('iframe');
            iframe.src = finalUrl;
            iframe.allow = "autoplay; encrypted-media; fullscreen";
            iframe.allowFullscreen = true;
            wrapper.appendChild(iframe);
        }

        // ربط الأحداث بـ addEventListener لتجنب مشاكل الحظر في ديسكورد
        document.addEventListener('DOMContentLoaded', () => {
            const playButton = document.getElementById('btnPlay');
            const nextServerButton = document.getElementById('btnNextServer');

            if (playButton) {
                playButton.addEventListener('click', loadPlayer);
            }

            if (nextServerButton) {
                nextServerButton.addEventListener('click', () => {
                    currentServerIndex = (currentServerIndex + 1) % servers.length;
                    loadPlayer();
                });
            }
        });
    </script>
</body>
</html>
