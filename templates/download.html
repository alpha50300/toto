<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Ready - Tool Alpha</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --accent-color: #22c55e; --text-main: #f8fafc; --text-muted: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .success-card { background: var(--card-bg); border-radius: 20px; padding: 50px 40px; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.05); width: 100%; max-width: 550px; animation: scaleUp 0.4s ease; }
        .success-icon { width: 80px; height: 80px; background: rgba(34, 197, 94, 0.1); color: var(--accent-color); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 3rem; margin: 0 auto 25px auto; }
        .file-box { background: #0f172a; padding: 15px; border-radius: 10px; font-weight: 600; color: #38bdf8; margin: 20px 0; }
        .btn-download { width: 100%; background: var(--accent-color); color: white; border: none; padding: 16px; border-radius: 10px; font-size: 1.1rem; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; text-decoration: none; transition: 0.3s; }
        .btn-download:hover { background: #16a34a; box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); }
        .warning { margin-top: 25px; font-size: 0.85rem; color: #ef4444; display: flex; align-items: center; justify-content: center; gap: 5px; }
        @keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="success-icon"><i class="fa-solid fa-circle-check"></i></div>
        <h2>File Completed!</h2>
        <p style="color: var(--text-muted);">Your file has been compiled and processed correctly.</p>
        <div class="file-box"><i class="fa-solid fa-file-export"></i> {{ filename }}</div>
        <a href="/download-file/{{ task_id }}/{{ filename }}" class="btn-download"><i class="fa-solid fa-download"></i> Download File Now</a>
        <div class="warning"><i class="fa-solid fa-triangle-exclamation"></i> Security Warning: This download payload will be completely wiped from our server memory in 30 minutes.</div>
    </div>
</body>
</html>
