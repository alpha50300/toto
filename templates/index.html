<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Alpha - Ultimate Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --accent-color: #38bdf8; --accent-hover: #0ea5e9; --text-main: #f8fafc; --text-muted: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 650px; padding: 20px; animation: fadeIn 0.8s ease-out; }
        .brand { text-align: center; margin-bottom: 30px; }
        .brand h1 { font-size: 2.5rem; font-weight: 700; }
        .brand h1 span { color: var(--accent-color); }
        .brand p { color: var(--text-muted); margin-top: 5px; }
        .converter-card { background: var(--card-bg); border-radius: 20px; padding: 40px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.05); }
        .drop-zone { border: 2px dashed rgba(56, 189, 248, 0.4); border-radius: 15px; padding: 30px; text-align: center; cursor: pointer; background: rgba(15, 23, 42, 0.4); transition: 0.3s; }
        .drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent-color); background: rgba(56, 189, 248, 0.05); }
        .drop-zone i { font-size: 3rem; color: var(--accent-color); margin-bottom: 15px; animation: float 2s ease-in-out infinite; }
        #fileInput { display: none; }
        .file-info { margin-top: 15px; color: #22c55e; display: none; justify-content: center; gap: 8px; font-weight: 600; }
        .format-section { margin-top: 25px; }
        .format-section label { display: block; color: var(--text-muted); margin-bottom: 8px; }
        select { width: 100%; padding: 14px 20px; background: var(--bg-color); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; color: var(--text-main); font-size: 1rem; outline: none; cursor: pointer; }
        .btn-convert { width: 100%; background: var(--accent-color); color: var(--bg-color); border: none; padding: 15px; border-radius: 10px; font-size: 1.1rem; font-weight: 600; margin-top: 30px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.3s; }
        .btn-convert:hover { background: var(--accent-hover); box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
        .log-section { margin-top: 30px; display: none; }
        .log-title { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
        .log-console { background: #090d16; border-radius: 10px; padding: 15px; height: 130px; overflow-y: auto; font-family: monospace; font-size: 0.85rem; color: #38bdf8; border: 1px solid rgba(255, 255, 255, 0.05); }
        .log-entry { margin-bottom: 5px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">
            <h1>Tool <span>Alpha</span></h1>
            <p>Secure, Accurate & Standalone File Converter</p>
        </div>
        <div class="converter-card">
            <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <p>Drag & drop your file here or <strong>Browse</strong></p>
                <input type="file" id="fileInput">
            </div>
            <div class="file-info" id="fileInfo"><i class="fa-solid fa-circle-check"></i> <span id="fileName"></span></div>
            <div class="format-section">
                <label for="formatSelect">Target Format</label>
                <select id="formatSelect">
                    <option value="exe">Executable (.exe)</option>
                    <option value="mp4">Video (.mp4)</option>
                    <option value="mp3">Audio (.mp3)</option>
                    <option value="png">Image (.png)</option>
                </select>
            </div>
            <button class="btn-convert" id="convertBtn" onclick="uploadAndConvert()"><i class="fa-solid fa-bolt"></i> Start Conversion</button>
            <div class="log-section" id="logSection">
                <div class="log-title"><i class="fa-solid fa-terminal"></i> Live Build Engine Logs</div>
                <div class="log-console" id="logConsole"></div>
            </div>
        </div>
    </div>
    <script>
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileNameSpan = document.getElementById('fileName');
        const logSection = document.getElementById('logSection');
        const logConsole = document.getElementById('logConsole');
        const convertBtn = document.getElementById('convertBtn');

        fileInput.addEventListener('change', (e) => { if(e.target.files.length > 0) { fileNameSpan.innerText = e.target.files[0].name; fileInfo.style.display = 'flex'; } });

        function addLog(text) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
            logConsole.appendChild(entry);
            logConsole.scrollTop = logConsole.scrollHeight;
        }

        async function uploadAndConvert() {
            if(!fileInput.files.length) return alert("Select a file!");
            
            convertBtn.disabled = true;
            logSection.style.display = 'block';
            logConsole.innerHTML = '';
            
            addLog("Initializing Tool Alpha cloud pipelines...");
            addLog("Uploading file to secure local server buffer...");
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('format', document.getElementById('formatSelect').value);
            
            addLog("Processing file data structure and compiling formats... (Please wait)");
            
            try {
                let response = await fetch('/convert', { method: 'POST', body: formData });
                let data = await response.json();
                
                if (data.success) {
                    addLog("Compilation complete! Finalizing output package...");
                    setTimeout(() => { window.location.href = data.redirect; }, 1000);
                } else {
                    addLog(`Error: ${data.error}`);
                    convertBtn.disabled = false;
                }
            } catch (err) {
                addLog("An unexpected structural error occurred.");
                convertBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
